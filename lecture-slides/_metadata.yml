title: "Advanced Empirical Finance: Topics and Data Science"
author: 
  name: Stefan Voigt
  affiliations: University of Copenhagen and Danish Finance Institute (DFI)
  orcid: 0000-0001-5619-3161
date: today
date-format: "[Spring] YYYY"
# Every deck exists as reveal.js slides (.html) and as a PDF of them for
# printing and annotating: render the deck, then run tools/deck_pdf.py on it.
format:
  revealjs:
    theme: ku_clean.scss
    pdf-separate-fragments: false
    slide-number: true
    lightbox: true
    logo: ku_logo.png
    smaller: true
    # KaTeX keeps math as text in the PDF; MathJax math prints as drawings
    html-math-method: katex
    embed-resources: true
    code-line-numbers: false
execute:
  echo: true
